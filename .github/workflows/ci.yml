name: TrustHR CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Test Suite (176 Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trusthr
          POSTGRES_PASSWORD: trusthr_test_password
          POSTGRES_DB: trusthr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://trusthr:trusthr_test_password@localhost:5432/trusthr_test
          DATABASE_URL: postgresql+psycopg://trusthr:trusthr_test_password@localhost:5432/trusthr_test
          JWT_SECRET: test_secret_key_ci_environment_32chars_min_length
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v -q

  frontend-build:
    name: Frontend TypeScript & Vite Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend && npm ci

      - name: Build production bundle
        run: |
          cd frontend && npm run build
