
services:
  # 1. Database (PostgreSQL with pgvector for Member 1's RAG)
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Mailpit (Fake SMTP server for emails)
  mailpit:
    image: axllent/mailpit:v1.15
    networks:
      - internal_net

  # 3. FastAPI Backend
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - internal_net
    # Security Hardening: Run as non-root user
    user: "1000:1000"

  # 4. React Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    networks:
      - internal_net

  # 5. Caddy (The only exposed service)
  caddy:
    image: caddy:2.7-alpine
    ports:
      - "80:80" # ONLY Caddy is exposed to the host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
      - web
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
# TrustHR AI: the whole stack with one command.
#
# First time (from this folder):
#   cp .env.example .env                    # compose settings: POSTGRES_PASSWORD, host ports
#   cp backend/.env.example backend/.env    # app settings: set JWT_SECRET (and LLM keys if wanted)
#   docker compose up -d --build
#   docker compose run --rm api python -m scripts.seed
#
# App: http://localhost:${WEB_PORT:-8080}   Mailpit UI: http://localhost:${MAILPIT_UI_PORT:-8025}
# Tests (throwaway database): docker compose --profile test run --rm tests
# Reset everything (deletes data): docker compose down -v
#
# Only the web (Caddy) and Mailpit UI ports are published, and only on 127.0.0.1.
# PostgreSQL, the API, the worker and Mailpit SMTP stay on the internal network.

name: trusthr

x-backend: &backend
  build: ./backend
  image: trusthr-backend
  restart: unless-stopped
  env_file: backend/.env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://trusthr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/trusthr
    UPLOAD_DIR: /app/var/uploads
    EMBEDDED_WORKER: "false"
    CORS_ORIGINS: '["http://localhost:${WEB_PORT:-8080}"]'
    # Internal address of the fictional mailbox, for the inbox milestone (M2).
    MAILPIT_SMTP_HOST: mailpit
    MAILPIT_SMTP_PORT: "1025"
    MAILPIT_API_URL: http://mailpit:8025
  volumes:
    - uploads:/app/var/uploads

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trusthr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trusthr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trusthr -d trusthr"]
      interval: 3s
      retries: 20

  # Safe email sink: SMTP on mailpit:1025 (internal), web UI and REST API on 8025.
  # Nothing ever leaves the machine.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  api:
    <<: *backend
    # Behind Caddy, the client IP comes from X-Forwarded-For (Caddy overwrites any value
    # the browser sends). Trusting every proxy is safe here only because the API has no
    # published port: Caddy is the only way in.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.runner"]
    # The API creates the schema on start-up; waiting for it avoids two processes
    # creating tables and triggers at the same time on a fresh database.
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    image: trusthr-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # ---- test profile: never started by a plain "docker compose up" ----

  # Disposable test database: data lives in memory and the test suite wipes its
  # schema before every test. Published on 127.0.0.1 so pytest can also run from the host:
  #   TEST_DATABASE_URL=postgresql+psycopg://trusthr:trusthr_test@localhost:5433/trusthr_test
  db-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_USER: trusthr
      POSTGRES_PASSWORD: trusthr_test
      POSTGRES_DB: trusthr_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trusthr -d trusthr_test"]
      interval: 2s
      retries: 30

  tests:
    image: trusthr-backend
    build: ./backend
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://trusthr:trusthr_test@db-test:5432/trusthr_test
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/tests:/app/tests:ro
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
