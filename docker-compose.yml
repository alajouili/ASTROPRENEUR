
services:
  # 1. Database (PostgreSQL with pgvector for Member 1's RAG)
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Mailpit (Fake SMTP server for emails)
  mailpit:
    image: axllent/mailpit:v1.15
    networks:
      - internal_net

  # 3. FastAPI Backend
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - internal_net
    # Security Hardening: Run as non-root user
    user: "1000:1000"

  # 4. React Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    networks:
      - internal_net

  # 5. Caddy (The only exposed service)
  caddy:
    image: caddy:2.7-alpine
    ports:
      - "80:80" # ONLY Caddy is exposed to the host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
      - web
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data: